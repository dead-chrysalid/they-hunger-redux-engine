; Merge these values into the stock OptiScaler v0.9.4 INI.
; Unlisted settings retain their stock defaults or user-selected values.

[Upscalers]
VulkanUpscaler=fsr31_12

[Inputs]
EnableDlssInputs=false
EnableXeSSInputs=false
EnableFsr2Inputs=true
UseFsr2VulkanInputs=true
Fsr2Pattern=true
EnableFsr3Inputs=false
EnableFfxInputs=false

[FSR]
; The bundled DX12 upscaler is already FSR 4.1.1. This disables only the
; separate legacy-module/driver upgrade path.
Fsr4Update=false
Fsr4EnableWatermark=false

[Log]
LogToFile=false

[InitFlags]
; RayTracedGL1's FSR2 dispatch does not provide an exposure texture.
AutoExposure=true

[ProcessFilter]
TargetProcessName=xash3d.exe

[Hotfix]
CheckForUpdate=false
